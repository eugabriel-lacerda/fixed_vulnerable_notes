name: CI

on:
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high
  
  sast:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: javascript-typescript
        queries: security-extended

    - name: Analyze with CodeQL
      uses: github/codeql-action/analyze@v4

    - name: Install Semgrep
      run: pip install semgrep

    - name: Run Semgrep (Auto)
      run: semgrep scan --config=auto

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  dast:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Start PostgreSQL
        working-directory: backend
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        working-directory: backend
        run: |
          until docker compose exec -T postgres pg_isready -U vuln_notes -d vuln_notes; do
            sleep 2
          done

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://vuln_notes:vuln_notes@localhost:5432/vuln_notes
        run: npx drizzle-kit migrate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Start backend
        working-directory: backend
        env:
          PORT: 3002
          DB_USER: vuln_notes
          DB_PASSWORD: vuln_notes
          DB_NAME: vuln_notes
          DB_PORT: 5432
          DATABASE_URL: postgresql://vuln_notes:vuln_notes@localhost:5432/vuln_notes
          JWT_SECRET: ci-test-jwt-secret
          CORS_ORIGIN: http://localhost:5173
          AUTH_RATE_LIMIT: 1000
          NOTE_RATE_LIMIT: 1000
        run: npm run start &

      - name: Wait for backend
        run: | 
          until curl --fail http://localhost:3002/health; do
            sleep 2
          done

      - name: Create DAST test user
        run: |
          curl --fail \
            -X POST http://localhost:3002/auth/register \
            -H "Content-Type: application/json" \
            -d '{
              "email": "zap@example.com",
              "password": "ZapTest123!"
            }'

      - name: Log in DAST test user and capture token
        run: |
          TOKEN=$(curl --fail \
            -X POST http://localhost:3002/auth/login \
            -H "Content-Type: application/json" \
            -d '{
              "email": "zap@example.com",
              "password": "ZapTest123!"
            }' | jq -r '.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to obtain DAST token from login response"
            exit 1
          fi

          echo "DAST_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Verify DAST authentication
        run: |
          curl --fail \
            -H "Authorization: Bearer $DAST_TOKEN" \
            http://localhost:3002/notes

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: npm run preview -- --host 0.0.0.0 --port 5173 &

      - name: Wait for frontend
        run: |
          until curl --fail http://localhost:5173; do
            sleep 2
          done

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:5173
          allow_issue_writing: true
          fail_action: true

      - name: Clean ZAP baseline reports
        run: sudo rm -f report_json.json report_md.md report_html.html

      - name: OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ env.DAST_TOKEN }}
          ZAP_AUTH_HEADER_SITE: localhost
        with:
          target: backend/openapi.yaml
          format: openapi
          allow_issue_writing: true
          fail_action: true
          artifact_name: zap_api_scan